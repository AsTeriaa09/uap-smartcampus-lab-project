{% extends 'base.html' %}

{% block body %}
<div class="flex h-screen">
    <!-- Sidebar -->
    <aside class="w-64 bg-black text-white flex flex-col">
        <!-- Logo -->
        <div class="p-6 border-b border-gray-800">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-white rounded-lg flex items-center justify-center">
                    <i class="fas fa-shield-alt text-black text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold">Authority Portal</h1>
                    <p class="text-xs text-gray-400">Management Panel</p>
                </div>
            </div>
        </div>

        <!-- Navigation -->
        <nav class="flex-1 p-4 space-y-2">
            <a href="{% url 'authority_dashboard' %}" class="flex items-center space-x-3 px-4 py-3 rounded-lg {% if active_page == 'dashboard' %}bg-white text-black{% else %}text-gray-300 hover:bg-gray-800{% endif %} transition">
                <i class="fas fa-home w-5"></i>
                <span class="font-medium">Dashboard</span>
            </a>
            <a href="{% url 'authority_menu_list' %}" class="flex items-center space-x-3 px-4 py-3 rounded-lg {% if active_page == 'menu' %}bg-white text-black{% else %}text-gray-300 hover:bg-gray-800{% endif %} transition">
                <i class="fas fa-utensils w-5"></i>
                <span class="font-medium">Menu Items</span>
            </a>
            <a href="{% url 'authority_menu_add' %}" class="flex items-center space-x-3 px-4 py-3 rounded-lg {% if active_page == 'add_menu' %}bg-white text-black{% else %}text-gray-300 hover:bg-gray-800{% endif %} transition">
                <i class="fas fa-plus-circle w-5"></i>
                <span class="font-medium">Add Menu Item</span>
            </a>
        </nav>

        <!-- Back to Site -->
        <div class="p-4 border-t border-gray-800">
            <a href="{% url 'dashboard' %}" class="flex items-center space-x-3 px-4 py-3 rounded-lg text-gray-300 hover:bg-gray-800 transition">
                <i class="fas fa-arrow-left w-5"></i>
                <span class="font-medium">Back to Site</span>
            </a>
        </div>
    </aside>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col overflow-hidden bg-gray-50">
        <!-- Header -->
        <header class="bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-4">
                <h2 class="text-xl font-semibold text-black">{{ page_title }}</h2>
            </div>

            <!-- User Avatar Dropdown -->
            <div class="relative">
                <button onclick="toggleDropdown()" class="flex items-center space-x-3 focus:outline-none">
                    <div class="w-10 h-10 bg-black rounded-full flex items-center justify-center text-white font-semibold">
                        {{ user.username|first|upper }}
                    </div>
                    <span class="text-gray-700 font-medium">{{ user.username }}</span>
                    <i class="fas fa-chevron-down text-gray-500 text-sm"></i>
                </button>
                
                <!-- Dropdown Menu -->
                <div id="userDropdown" class="hidden absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg border border-gray-200 py-2 z-50">
                    <a href="{% url 'authority_logout' %}" class="block px-4 py-2 text-gray-700 hover:bg-gray-100 transition">
                        <i class="fas fa-sign-out-alt mr-2"></i>Logout
                    </a>
                </div>
            </div>
        </header>

        <!-- Page Content -->
        <main class="flex-1 overflow-y-auto p-6">
            {% if messages %}
            <div class="mb-4 space-y-2">
                {% for message in messages %}
                <div class="p-4 rounded-lg {% if message.tags == 'error' %}bg-red-500 text-white{% elif message.tags == 'success' %}bg-green-500 text-white{% else %}bg-gray-200 text-gray-800{% endif %}">
                    {{ message }}
                </div>
                {% endfor %}
            </div>
            {% endif %}
            
            {% block content %}{% endblock %}
        </main>
    </div>
</div>

<script>
function toggleDropdown() {
    const dropdown = document.getElementById('userDropdown');
    dropdown.classList.toggle('hidden');
}

document.addEventListener('click', function(event) {
    const dropdown = document.getElementById('userDropdown');
    const button = event.target.closest('button');
    if (!button && !dropdown.contains(event.target)) {
        dropdown.classList.add('hidden');
    }
});
</script>
{% endblock %}
