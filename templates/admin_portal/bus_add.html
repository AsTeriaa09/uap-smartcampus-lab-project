{% extends 'admin_portal/layout.html' %}

{% block title %}Add Bus Route - UAP Admin{% endblock %}

{% block content %}
<div class="max-w-2xl">
    <div class="flex items-center space-x-3 mb-6">
        <a href="{% url 'admin_bus_routes' %}" class="w-8 h-8 flex items-center justify-center rounded-xl bg-white border border-gray-100 text-gray-400 hover:text-primary smooth-transition shadow-sm">
            <i class="fas fa-arrow-left text-sm"></i>
        </a>
        <h3 class="text-lg font-bold text-gray-800">Add Bus Route</h3>
    </div>
    <div class="bg-white rounded-2xl border border-gray-100 p-6 shadow-sm">
        <form method="POST" class="space-y-5">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">Route Name <span class="text-red-400">*</span></label>
                <input type="text" name="route_name" required placeholder="e.g., Route A - Campus to City" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition bg-gray-50 focus:bg-white">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">Departure Point <span class="text-red-400">*</span></label>
                    <input type="text" name="departure_point" required class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition bg-gray-50 focus:bg-white">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">Destination <span class="text-red-400">*</span></label>
                    <input type="text" name="destination" required class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition bg-gray-50 focus:bg-white">
                </div>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">Departure Time <span class="text-red-400">*</span></label>
                    <input type="time" name="departure_time" required class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition bg-gray-50 focus:bg-white">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">Arrival Time <span class="text-red-400">*</span></label>
                    <input type="time" name="arrival_time" required class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition bg-gray-50 focus:bg-white">
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">Status <span class="text-red-400">*</span></label>
                <select name="status" required class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition bg-gray-50 focus:bg-white">
                    <option value="on_time">On Time</option>
                    <option value="delayed">Delayed</option>
                    <option value="cancelled">Cancelled</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">Description</label>
                <textarea name="description" rows="3" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition bg-gray-50 focus:bg-white resize-none"></textarea>
            </div>
            <div class="flex items-center space-x-2">
                <input type="checkbox" name="is_active" id="is_active" checked class="w-4 h-4 accent-primary rounded">
                <label for="is_active" class="text-sm text-gray-700">Active</label>
            </div>
            <div class="flex space-x-3 pt-2">
                <button type="submit" class="px-6 py-2.5 gradient-bg text-white rounded-xl text-sm font-semibold hover:shadow-lg hover:shadow-primary/25 smooth-transition">
                    <i class="fas fa-save mr-2"></i>Add Bus Route
                </button>
                <a href="{% url 'admin_bus_routes' %}" class="px-6 py-2.5 bg-gray-100 text-gray-600 rounded-xl text-sm font-medium hover:bg-gray-200 smooth-transition">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
