{% extends 'admin_portal/layout.html' %}

{% block title %}Edit Menu Item - UAP Admin{% endblock %}

{% block content %}
<div class="max-w-2xl">
    <div class="flex items-center space-x-3 mb-6">
        <a href="{% url 'admin_menu_list' %}" class="w-8 h-8 flex items-center justify-center rounded-xl bg-white border border-gray-100 text-gray-400 hover:text-primary smooth-transition shadow-sm">
            <i class="fas fa-arrow-left text-sm"></i>
        </a>
        <h3 class="text-lg font-bold text-gray-800">Edit Menu Item</h3>
    </div>
    <div class="bg-white rounded-2xl border border-gray-100 p-6 shadow-sm">
        <form method="POST" enctype="multipart/form-data" class="space-y-5">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">Item Name <span class="text-red-400">*</span></label>
                <input type="text" name="name" value="{{ item.name }}" required class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition bg-gray-50 focus:bg-white">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">Description</label>
                <textarea name="description" rows="3" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition bg-gray-50 focus:bg-white resize-none">{{ item.description }}</textarea>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">Price <span class="text-red-400">*</span></label>
                    <input type="number" name="price" value="{{ item.price }}" step="0.01" required class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition bg-gray-50 focus:bg-white">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">Category <span class="text-red-400">*</span></label>
                    <select name="category" required class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition bg-gray-50 focus:bg-white">
                        <option value="breakfast" {% if item.category == 'breakfast' %}selected{% endif %}>Breakfast</option>
                        <option value="lunch" {% if item.category == 'lunch' %}selected{% endif %}>Lunch</option>
                        <option value="dinner" {% if item.category == 'dinner' %}selected{% endif %}>Dinner</option>
                        <option value="snacks" {% if item.category == 'snacks' %}selected{% endif %}>Snacks</option>
                        <option value="beverages" {% if item.category == 'beverages' %}selected{% endif %}>Beverages</option>
                    </select>
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">Image</label>
                {% if item.image %}<img src="{{ item.image.url }}" alt="{{ item.name }}" class="w-20 h-20 object-cover rounded-xl mb-2">{% endif %}
                <input type="file" name="image" accept="image/*" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-primary transition bg-gray-50">
            </div>
            <div class="flex items-center space-x-2">
                <input type="checkbox" name="is_available" id="is_available" {% if item.is_available %}checked{% endif %} class="w-4 h-4 accent-primary rounded">
                <label for="is_available" class="text-sm text-gray-700">Available</label>
            </div>
            <div class="flex space-x-3 pt-2">
                <button type="submit" class="px-6 py-2.5 gradient-bg text-white rounded-xl text-sm font-semibold hover:shadow-lg hover:shadow-primary/25 smooth-transition">
                    <i class="fas fa-save mr-2"></i>Update Item
                </button>
                <a href="{% url 'admin_menu_list' %}" class="px-6 py-2.5 bg-gray-100 text-gray-600 rounded-xl text-sm font-medium hover:bg-gray-200 smooth-transition">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
