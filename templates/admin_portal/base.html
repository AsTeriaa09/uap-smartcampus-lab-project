<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}UAP Admin Portal{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2f5850',
                        secondary: '#1f514f',
                        accent: '#4b7474',
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
        }
        
        .admin-sidebar-link.active {
            background: linear-gradient(135deg, #2f5850 0%, #1f514f 100%);
            color: #fff;
            box-shadow: 0 4px 6px -1px rgba(47, 88, 80, 0.3);
        }
        
        .gradient-bg {
            background: linear-gradient(135deg, #2f5850 0%, #1f514f 50%, #4b7474 100%);
        }
        
        .card-hover {
            transition: all 0.3s ease;
        }
        
        .card-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }
        
        .smooth-transition {
            transition: all 0.2s ease-in-out;
        }
    </style>
    {% block extra_style %}{% endblock %}
</head>
<body class="bg-gray-50">
    {% block body %}{% endblock %}
</body>
</html>
