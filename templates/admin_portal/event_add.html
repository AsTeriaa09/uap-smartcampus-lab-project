{% extends 'admin_portal/layout.html' %}

{% block title %}Add Event - UAP Admin{% endblock %}

{% block content %}
<div class="max-w-2xl">
    <div class="flex items-center space-x-3 mb-6">
        <a href="{% url 'admin_events' %}" class="w-8 h-8 flex items-center justify-center rounded-xl bg-white border border-gray-100 text-gray-400 hover:text-primary smooth-transition shadow-sm">
            <i class="fas fa-arrow-left text-sm"></i>
        </a>
        <h3 class="text-lg font-bold text-gray-800">Add Event</h3>
    </div>
    <div class="bg-white rounded-2xl border border-gray-100 p-6 shadow-sm">
        <form method="POST" enctype="multipart/form-data" class="space-y-5">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">Event Title <span class="text-red-400">*</span></label>
                <input type="text" name="title" required class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition bg-gray-50 focus:bg-white">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">Description <span class="text-red-400">*</span></label>
                <textarea name="description" rows="4" required class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition bg-gray-50 focus:bg-white resize-none"></textarea>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">Club <span class="text-red-400">*</span></label>
                <select name="club" required class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition bg-gray-50 focus:bg-white">
                    <option value="">Select Club</option>
                    {% for club in clubs %}<option value="{{ club.id }}">{{ club.name }}</option>{% endfor %}
                </select>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">Event Date <span class="text-red-400">*</span></label>
                    <input type="date" name="event_date" required class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition bg-gray-50 focus:bg-white">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">Event Time <span class="text-red-400">*</span></label>
                    <input type="time" name="event_time" required class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition bg-gray-50 focus:bg-white">
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">Location <span class="text-red-400">*</span></label>
                <input type="text" name="location" required class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition bg-gray-50 focus:bg-white">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">Event Image</label>
                <input type="file" name="image" accept="image/*" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-primary transition bg-gray-50">
            </div>
            <div class="flex items-center space-x-2">
                <input type="checkbox" name="is_active" id="is_active" checked class="w-4 h-4 accent-primary rounded">
                <label for="is_active" class="text-sm text-gray-700">Active</label>
            </div>
            <div class="flex space-x-3 pt-2">
                <button type="submit" class="px-6 py-2.5 gradient-bg text-white rounded-xl text-sm font-semibold hover:shadow-lg hover:shadow-primary/25 smooth-transition">
                    <i class="fas fa-save mr-2"></i>Add Event
                </button>
                <a href="{% url 'admin_events' %}" class="px-6 py-2.5 bg-gray-100 text-gray-600 rounded-xl text-sm font-medium hover:bg-gray-200 smooth-transition">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
