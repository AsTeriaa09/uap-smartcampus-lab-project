{% extends 'admin_portal/layout.html' %}

{% block title %}Edit Bus Route - UAP Admin{% endblock %}

{% block content %}
<div class="max-w-3xl">
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-8">
        <h3 class="text-2xl font-bold text-primary mb-6">Edit Bus Route</h3>
        
        <form method="POST" class="space-y-6">
            {% csrf_token %}
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Route Name *</label>
                <input type="text" name="route_name" value="{{ route.route_name }}" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition">
            </div>
            
            <div class="grid grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Departure Point *</label>
                    <input type="text" name="departure_point" value="{{ route.departure_point }}" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Destination *</label>
                    <input type="text" name="destination" value="{{ route.destination }}" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition">
                </div>
            </div>
            
            <div class="grid grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Departure Time *</label>
                    <input type="time" name="departure_time" value="{{ route.departure_time|time:'H:i' }}" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Arrival Time *</label>
                    <input type="time" name="arrival_time" value="{{ route.arrival_time|time:'H:i' }}" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition">
                </div>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Status *</label>
                <select name="status" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition">
                    <option value="on_time" {% if route.status == 'on_time' %}selected{% endif %}>On Time</option>
                    <option value="delayed" {% if route.status == 'delayed' %}selected{% endif %}>Delayed</option>
                    <option value="cancelled" {% if route.status == 'cancelled' %}selected{% endif %}>Cancelled</option>
                </select>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Description</label>
                <textarea name="description" rows="3" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition">{{ route.description }}</textarea>
            </div>
            
            <div class="flex items-center">
                <input type="checkbox" name="is_active" id="is_active" {% if route.is_active %}checked{% endif %} class="w-4 h-4 text-primary border-gray-300 rounded focus:ring-primary">
                <label for="is_active" class="ml-2 text-sm text-gray-700">Active</label>
            </div>
            
            <div class="flex space-x-4 pt-4">
                <button type="submit" class="px-8 py-3 gradient-bg text-white rounded-lg font-medium hover:shadow-lg smooth-transition">
                    <i class="fas fa-save mr-2"></i>Update Bus Route
                </button>
                <a href="{% url 'admin_bus_routes' %}" class="px-8 py-3 bg-gray-200 text-gray-700 rounded-lg font-medium hover:bg-gray-300 smooth-transition">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
