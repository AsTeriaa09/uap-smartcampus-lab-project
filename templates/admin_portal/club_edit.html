{% extends 'admin_portal/layout.html' %}

{% block title %}Edit Club - UAP Admin{% endblock %}

{% block content %}
<div class="max-w-2xl">
    <div class="flex items-center space-x-3 mb-6">
        <a href="{% url 'admin_clubs' %}" class="w-8 h-8 flex items-center justify-center rounded-xl bg-white border border-gray-100 text-gray-400 hover:text-primary smooth-transition shadow-sm">
            <i class="fas fa-arrow-left text-sm"></i>
        </a>
        <h3 class="text-lg font-bold text-gray-800">Edit Club</h3>
    </div>
    <div class="bg-white rounded-2xl border border-gray-100 p-6 shadow-sm">
        <form method="POST" enctype="multipart/form-data" class="space-y-5">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">Club Name <span class="text-red-400">*</span></label>
                <input type="text" name="name" value="{{ club.name }}" required class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition bg-gray-50 focus:bg-white">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">Description <span class="text-red-400">*</span></label>
                <textarea name="description" rows="4" required class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition bg-gray-50 focus:bg-white resize-none">{{ club.description }}</textarea>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">Category <span class="text-red-400">*</span></label>
                    <select name="category" required class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition bg-gray-50 focus:bg-white">
                        <option value="cultural" {% if club.category == 'cultural' %}selected{% endif %}>Cultural</option>
                        <option value="sports" {% if club.category == 'sports' %}selected{% endif %}>Sports</option>
                        <option value="academic" {% if club.category == 'academic' %}selected{% endif %}>Academic</option>
                        <option value="technology" {% if club.category == 'technology' %}selected{% endif %}>Technology</option>
                        <option value="arts" {% if club.category == 'arts' %}selected{% endif %}>Arts</option>
                        <option value="social" {% if club.category == 'social' %}selected{% endif %}>Social</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">President</label>
                    <input type="text" name="president" value="{{ club.president }}" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition bg-gray-50 focus:bg-white">
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">Contact Email</label>
                <input type="email" name="contact_email" value="{{ club.contact_email }}" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition bg-gray-50 focus:bg-white">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">Logo</label>
                {% if club.logo %}<img src="{{ club.logo.url }}" alt="{{ club.name }}" class="w-20 h-20 object-cover rounded-xl mb-2">{% endif %}
                <input type="file" name="logo" accept="image/*" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-primary transition bg-gray-50">
            </div>
            <div class="flex items-center space-x-2">
                <input type="checkbox" name="is_active" id="is_active" {% if club.is_active %}checked{% endif %} class="w-4 h-4 accent-primary rounded">
                <label for="is_active" class="text-sm text-gray-700">Active</label>
            </div>
            <div class="flex space-x-3 pt-2">
                <button type="submit" class="px-6 py-2.5 gradient-bg text-white rounded-xl text-sm font-semibold hover:shadow-lg hover:shadow-primary/25 smooth-transition">
                    <i class="fas fa-save mr-2"></i>Update Club
                </button>
                <a href="{% url 'admin_clubs' %}" class="px-6 py-2.5 bg-gray-100 text-gray-600 rounded-xl text-sm font-medium hover:bg-gray-200 smooth-transition">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
