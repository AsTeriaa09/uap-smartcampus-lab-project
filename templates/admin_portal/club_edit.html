{% extends 'admin_portal/layout.html' %}

{% block title %}Edit Club - UAP Admin{% endblock %}

{% block content %}
<div class="max-w-3xl">
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-8">
        <h3 class="text-2xl font-bold text-primary mb-6">Edit Club</h3>
        
        <form method="POST" enctype="multipart/form-data" class="space-y-6">
            {% csrf_token %}
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Club Name *</label>
                <input type="text" name="name" value="{{ club.name }}" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Description *</label>
                <textarea name="description" rows="4" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition">{{ club.description }}</textarea>
            </div>
            
            <div class="grid grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Category *</label>
                    <select name="category" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition">
                        <option value="cultural" {% if club.category == 'cultural' %}selected{% endif %}>Cultural</option>
                        <option value="sports" {% if club.category == 'sports' %}selected{% endif %}>Sports</option>
                        <option value="academic" {% if club.category == 'academic' %}selected{% endif %}>Academic</option>
                        <option value="technology" {% if club.category == 'technology' %}selected{% endif %}>Technology</option>
                        <option value="arts" {% if club.category == 'arts' %}selected{% endif %}>Arts</option>
                        <option value="social" {% if club.category == 'social' %}selected{% endif %}>Social</option>
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">President</label>
                    <input type="text" name="president" value="{{ club.president }}" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition">
                </div>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Contact Email</label>
                <input type="email" name="contact_email" value="{{ club.contact_email }}" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Logo</label>
                {% if club.logo %}
                <img src="{{ club.logo.url }}" alt="{{ club.name }}" class="w-32 h-32 object-cover rounded-lg mb-2">
                {% endif %}
                <input type="file" name="logo" accept="image/*" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition">
            </div>
            
            <div class="flex items-center">
                <input type="checkbox" name="is_active" id="is_active" {% if club.is_active %}checked{% endif %} class="w-4 h-4 text-primary border-gray-300 rounded focus:ring-primary">
                <label for="is_active" class="ml-2 text-sm text-gray-700">Active</label>
            </div>
            
            <div class="flex space-x-4 pt-4">
                <button type="submit" class="px-8 py-3 gradient-bg text-white rounded-lg font-medium hover:shadow-lg smooth-transition">
                    <i class="fas fa-save mr-2"></i>Update Club
                </button>
                <a href="{% url 'admin_clubs' %}" class="px-8 py-3 bg-gray-200 text-gray-700 rounded-lg font-medium hover:bg-gray-300 smooth-transition">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
