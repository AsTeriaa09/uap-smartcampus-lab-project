{% extends 'authority/base.html' %}

{% block title %}Authority Login - UAP SmartCampus{% endblock %}

{% block body %}
<div class="min-h-screen flex items-center justify-center gradient-bg p-8">
    <div class="w-full max-w-md">
        <div class="bg-white rounded-2xl shadow-2xl border border-gray-100 p-8">
            <div class="flex items-center space-x-3 mb-8">
                <div class="w-12 h-12 gradient-bg rounded-xl flex items-center justify-center">
                    <i class="fas fa-user-shield text-white text-lg"></i>
                </div>
                <div>
                    <h2 class="text-xl font-bold text-gray-800">Authority Portal</h2>
                    <p class="text-gray-500 text-xs">Staff & Admin Login</p>
                </div>
            </div>

            {% if messages %}
            <div class="mb-6 space-y-2">
                {% for message in messages %}
                <div class="flex items-center space-x-2 p-3 rounded-xl {% if message.tags == 'error' %}bg-red-50 border border-red-200 text-red-700{% else %}bg-green-50 border border-green-200 text-green-700{% endif %} text-sm">
                    <i class="fas {% if message.tags == 'error' %}fa-exclamation-circle{% else %}fa-check-circle{% endif %}"></i>
                    <span>{{ message }}</span>
                </div>
                {% endfor %}
            </div>
            {% endif %}

            <form method="POST" class="space-y-5">
                {% csrf_token %}
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">Username</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                            <i class="fas fa-user text-gray-400 text-sm"></i>
                        </div>
                        <input type="text" name="username" required
                            class="w-full pl-10 pr-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition bg-gray-50 focus:bg-white"
                            placeholder="Enter username">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                            <i class="fas fa-lock text-gray-400 text-sm"></i>
                        </div>
                        <input type="password" name="password" required
                            class="w-full pl-10 pr-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition bg-gray-50 focus:bg-white"
                            placeholder="Enter password">
                    </div>
                </div>
                <button type="submit" class="w-full gradient-bg text-white py-3 rounded-xl font-semibold text-sm hover:shadow-lg hover:shadow-primary/25 transition-all duration-200">
                    <i class="fas fa-sign-in-alt mr-2"></i>Login
                </button>
            </form>

            <div class="mt-6 text-center">
                <a href="{% url 'login' %}" class="text-sm text-gray-400 hover:text-primary transition">
                    <i class="fas fa-arrow-left mr-1"></i>Back to User Login
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
