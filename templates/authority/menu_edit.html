{% extends 'authority/base.html' %}

{% block title %}Edit Menu Item - Authority Portal{% endblock %}

{% block body %}
<div class="min-h-screen bg-gray-50">
    <header class="bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 gradient-bg rounded-lg flex items-center justify-center">
                <i class="fas fa-user-shield text-white"></i>
            </div>
            <h1 class="text-xl font-bold text-gray-800">Authority Portal</h1>
        </div>
        <a href="{% url 'authority_logout' %}" class="text-red-600 hover:text-red-700 font-medium">
            <i class="fas fa-sign-out-alt mr-1"></i>Logout
        </a>
    </header>

    <main class="p-6 max-w-2xl mx-auto">
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-8">
            <h2 class="text-2xl font-bold text-gray-800 mb-6">Edit Menu Item</h2>

            <form method="POST" enctype="multipart/form-data" class="space-y-4">
                {% csrf_token %}
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Name *</label>
                    <input type="text" name="name" value="{{ item.name }}" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
                    <textarea name="description" rows="3" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary outline-none">{{ item.description }}</textarea>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Price *</label>
                        <input type="number" name="price" value="{{ item.price }}" step="0.01" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Category *</label>
                        <select name="category" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary outline-none">
                            <option value="breakfast" {% if item.category == 'breakfast' %}selected{% endif %}>Breakfast</option>
                            <option value="lunch" {% if item.category == 'lunch' %}selected{% endif %}>Lunch</option>
                            <option value="dinner" {% if item.category == 'dinner' %}selected{% endif %}>Dinner</option>
                            <option value="snacks" {% if item.category == 'snacks' %}selected{% endif %}>Snacks</option>
                            <option value="beverages" {% if item.category == 'beverages' %}selected{% endif %}>Beverages</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Image</label>
                    {% if item.image %}
                    <img src="{{ item.image.url }}" alt="{{ item.name }}" class="w-24 h-24 object-cover rounded-lg mb-2">
                    {% endif %}
                    <input type="file" name="image" accept="image/*" class="w-full px-4 py-3 border border-gray-300 rounded-lg">
                </div>
                <div class="flex items-center">
                    <input type="checkbox" name="is_available" id="is_available" {% if item.is_available %}checked{% endif %} class="w-4 h-4 text-primary border-gray-300 rounded">
                    <label for="is_available" class="ml-2 text-sm text-gray-700">Available</label>
                </div>
                <div class="flex space-x-4 pt-4">
                    <button type="submit" class="px-6 py-3 gradient-bg text-white rounded-lg font-medium hover:shadow-lg transition">
                        <i class="fas fa-save mr-2"></i>Update Item
                    </button>
                    <a href="{% url 'authority_menu_list' %}" class="px-6 py-3 bg-gray-200 text-gray-700 rounded-lg font-medium hover:bg-gray-300 transition">
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </main>
</div>
{% endblock %}
