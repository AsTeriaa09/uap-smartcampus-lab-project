{% extends "assignments/_base.html" %}
{% block assignments_inner %}
<h1 class="h3 mb-3">Create assignment</h1>
<form method="post" class="border rounded shadow-sm bg-white p-4" style="max-width: 720px;">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {% for field in form %}
    <div class="mb-3">
        <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {{ field.errors }}
    </div>
    {% endfor %}
    <button type="submit" class="btn btn-primary">Publish assignment</button>
    <a href="{% url 'assignments:course_list' %}" class="btn btn-outline-secondary">Back to courses</a>
</form>
{% endblock %}
