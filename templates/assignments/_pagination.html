{% if is_paginated %}
<nav aria-label="Pagination" class="mt-4">
    <ul class="pagination pagination-sm justify-content-center">
        {% if page_obj.has_previous %}
        <li class="page-item">
            <a class="page-link" href="?{% if query_nopage %}{{ query_nopage }}&amp;{% endif %}page={{ page_obj.previous_page_number }}">Previous</a>
        </li>
        {% endif %}
        <li class="page-item disabled"><span class="page-link">{{ page_obj.number }} / {{ paginator.num_pages }}</span></li>
        {% if page_obj.has_next %}
        <li class="page-item">
            <a class="page-link" href="?{% if query_nopage %}{{ query_nopage }}&amp;{% endif %}page={{ page_obj.next_page_number }}">Next</a>
        </li>
        {% endif %}
    </ul>
</nav>
{% endif %}
